name: Bump upstream
description: >-
  Update a DAppNode package's upstream version in the checked-out workspace
  with `bump-runner update`: the plain version in dappnode_package.json and the
  (optionally digest-pinned) value in docker-compose.yml. Does not commit,
  push, open pull requests, or bump the package's own version.
author: DAppNode

inputs:
  version:
    description: Upstream tag or version to apply. Empty resolves the latest upstream release (never a downgrade).
    required: false
    default: ""
  pin-digest:
    description: >-
      "true" writes VERSION@sha256:DIGEST to Compose, "false" writes plain
      versions, empty keeps the package's existing pinning (refreshing digests).
    required: false
    default: ""
  image:
    description: Image repository without tag or digest. Empty uses the Dockerfile FROM image.
    required: false
    default: ""
  upstream:
    description: Upstream repository (owner/repo) to update. Required when the manifest declares several.
    required: false
    default: ""
  provider:
    description: >-
      Version source when `version` is empty: docker (GitHub release validated
      against the image tag), github (release tag as-is), or docker_tags
      (highest image tag of the Dockerfile image, on Docker Hub or any OCI
      registry). Empty uses the package's default.
    required: false
    default: ""
  token:
    description: GitHub token for upstream release lookups.
    required: false
    default: ${{ github.token }}
  workspace:
    description: Package directory, relative to the job's working directory.
    required: false
    default: "."
  dry-run:
    description: '"true" reports the planned changes without writing files.'
    required: false
    default: "false"
  runner-image:
    description: >-
      TropiBot image providing bump-runner, e.g.
      docker.io/dappnode/tropibot:v0.1.14 to pin a release. Empty uses
      docker.io/dappnode/tropibot:latest.
    required: false
    default: ""

outputs:
  version:
    description: Plain resolved version written to the manifest.
    value: ${{ steps.update.outputs.version }}
  compose-version:
    description: Exact Compose value, including the digest when pinned.
    value: ${{ steps.update.outputs.compose-version }}
  digest:
    description: Resolved image digest, or empty when not pinned.
    value: ${{ steps.update.outputs.digest }}
  changed:
    description: '"true" when package files changed (or would change in a dry run).'
    value: ${{ steps.update.outputs.changed }}
  upstream:
    description: Upstream repository that was updated.
    value: ${{ steps.update.outputs.upstream }}
  previous-version:
    description: Manifest version before the update.
    value: ${{ steps.update.outputs.previous-version }}

runs:
  using: composite
  steps:
    - id: update
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PIN_DIGEST: ${{ inputs.pin-digest }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_UPSTREAM: ${{ inputs.upstream }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_RUNNER_IMAGE: ${{ inputs.runner-image }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/run.sh"'
