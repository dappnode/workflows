name: Bump Upstream Version

on:
  workflow_call:
    inputs:
      use_variants:
        description: "Deprecated, no effect: variant directories are always scanned"
        required: false
        type: boolean
        default: true
      variants_dir:
        description: "Path to SDK package variants (override for legacy layouts)"
        required: false
        type: string
        default: "package_variants"
      tag_pattern:
        description: "Optional regex to extract version from the upstream release tag"
        required: false
        type: string
        default: ""
      docker_tag_pattern:
        description: "Optional template for Docker tag checks, e.g. multiarch-{version}"
        required: false
        type: string
        default: ""
      provider:
        description: "Optional version source for the targeted upstream: docker, github, or docker_tags"
        required: false
        type: string
        default: ""
      build_arg:
        description: "Optional compose build arg override for the targeted upstream"
        required: false
        type: string
        default: ""
      upstream_repo:
        description: "Optional upstream repo slug the override inputs apply to (default: all upstreams)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "If true, log write operations without executing them"
        required: false
        type: boolean
        default: false
    secrets:
      TROPI_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-upstream:
    runs-on: ubuntu-latest
    name: Check Upstream Version
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.TROPI_APP_ID }}
          private-key: ${{ secrets.TROPI_APP_PRIVATE_KEY }}

      - name: Run upstream bump
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_APP_ID: ${{ vars.TROPI_APP_ID }}
          INPUT_VARIANTS_DIR: ${{ inputs.variants_dir }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_TAG_PATTERN: ${{ inputs.tag_pattern }}
          INPUT_DOCKER_TAG_PATTERN: ${{ inputs.docker_tag_pattern }}
          INPUT_BUILD_ARG: ${{ inputs.build_arg }}
          INPUT_UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Explicit CLI flags replace the legacy environment-variable mode.
          # Exit status 2 means some upstreams failed; the job fails either way.
          args=(pr "--repo=${GITHUB_REPOSITORY}" "--variants-dir=${INPUT_VARIANTS_DIR}")
          [[ -n "${INPUT_PROVIDER}" ]] && args+=("--provider=${INPUT_PROVIDER}")
          [[ -n "${INPUT_TAG_PATTERN}" ]] && args+=("--tag-pattern=${INPUT_TAG_PATTERN}")
          [[ -n "${INPUT_DOCKER_TAG_PATTERN}" ]] && args+=("--docker-tag-pattern=${INPUT_DOCKER_TAG_PATTERN}")
          [[ -n "${INPUT_BUILD_ARG}" ]] && args+=("--build-arg=${INPUT_BUILD_ARG}")
          [[ -n "${INPUT_UPSTREAM_REPO}" ]] && args+=("--upstream=${INPUT_UPSTREAM_REPO}")
          [[ "${INPUT_DRY_RUN}" == "true" ]] && args+=(--dry-run)

          # Credentials are passed by name so they never appear in process arguments.
          status=0
          docker run --rm --pull=always \
            --env GITHUB_TOKEN \
            --env GITHUB_APP_ID \
            dappnode/tropibot:latest \
            bump-runner "${args[@]}" > "${RUNNER_TEMP}/bump-summary.txt" || status=$?

          cat "${RUNNER_TEMP}/bump-summary.txt"
          {
            echo '### Upstream bump'
            echo '```text'
            cat "${RUNNER_TEMP}/bump-summary.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
